<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="3" />
  
  <!-- F5 Key Frame -->
  <rect x="20" y="20" width="88" height="88" rx="20" fill="none" stroke="url(#boltGrad)" stroke-width="2" opacity="0.3" />
  
  <!-- Lightning Bolt -->
  <path d="M70 24L36 70H62L54 104L92 56H66L70 24Z" fill="url(#boltGrad)" filter="url(#glow)" />
  
  <!-- Text F5 Badge -->
  <rect x="74" y="82" width="34" height="22" rx="6" fill="#18181b" stroke="url(#boltGrad)" stroke-width="1.5" />
  <text x="91" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#38bdf8" text-anchor="middle">F5</text>
</svg>
